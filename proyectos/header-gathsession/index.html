<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header - Gathsession</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <header class="header-principal">
        <img src="imagenes/logo-gathsession.svg" alt="" class="">
        <nav class="nav-principal">
          <ul>
            <li><a href="#!">Home</a></li>
            <li><a href="#!">Features</a></li>
            <li><a href="#!">Blog</a></li>
            <li><a href="#!">Contact</a></li>
            <li><a href="#!">About Us</a></li>
          </ul>
        </nav>
      </header>

      <div class="hero__content">
        <h1>Build your best community starting from here.</h1>
        <p>Meet and communicate with the best people to run
           projects, events or other activities in a more effective
            and fun way</p>
           <div class="hero__actions">
            <a href="#!" class="button">Get Started</a>
            <a href="#!" class="button-link">Learn More
               <img src="imagenes/Arrow.svg" alt="">
            </a>
             
            
           </div>
          <div class="hero__features">
            <div class="icon">
             <span class="icon__box">
               <img src="imagenes/icon-build.svg" alt="">
             </span>
             <p>Build<br>Community</p>
           </div>
           <div class="icon">
             <span class="icon__box">
               <img src="imagenes/icon-share.svg" alt="">
             </span>
              <p>Share<br>Events</p>
           </div>
           <div class="icon">
             <span class="icon__box">
              <img src="imagenes/icon-info.svg" alt="">
             </span>
             <p>Get<br>Information</p>
           </div>
         </div>


         
      </div>
           <div class="hero__feature-item hero__feature-item--morada">
            <img src="imagenes/foto-1-morada.png" alt="">
           </div>
           <div class="hero__feature-item hero__feature-item--turquesa">
            <img src="imagenes/foto-2-turquesa.png" alt="">
           </div>
           <div class="hero__feature-item hero__feature-item--amarilla">
            <img src="imagenes/foto-3-amarilla.png" alt="">
           </div>
           <div class="hero__feature-item hero__feature-item--naranja">
            <img src="imagenes/foto-4-naranja.png" alt="">
           </div>
           <div class="hero__feature-item hero__feature-item--rosa">
            <img src="imagenes/foto-5-rosa.png" alt="">
           </div>


      
    </div>


  </body>
</html>
